<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biotech Lab Calculator 🧬</title>
    <!-- Tailwind CSS for sleek UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-8">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-lg border border-gray-200">
        <h1 class="text-3xl font-extrabold text-indigo-600 mb-2">🧬 Biotech Lab Calculator</h1>
        <p class="text-gray-500 mb-6 text-sm">EWU GEB স্টুডেন্টদের জন্য সহজ ল্যাব ক্যালকুলেটর।</p>

        <!-- Tool 1: Molarity Calculator -->
        <div class="mb-8 p-5 bg-indigo-50 rounded-xl border border-indigo-100">
            <h2 class="text-xl font-bold text-indigo-900 mb-4">🧪 1. Molarity Calculator</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Desired Molarity (M):</label>
                    <input type="number" id="molarity" value="0.1" step="0.01" class="w-full p-2.5 mt-1 border rounded-lg border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Volume (L):</label>
                    <input type="number" id="volume" value="1.0" step="0.1" class="w-full p-2.5 mt-1 border rounded-lg border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Molecular Weight (g/mol):</label>
                    <input type="number" id="mw" value="58.44" step="0.1" class="w-full p-2.5 mt-1 border rounded-lg border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button onclick="calcMolarity()" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg hover:bg-indigo-700 font-semibold transition">Calculate Mass</button>
                <div id="molarityResult" class="mt-3 text-indigo-950 font-semibold text-lg"></div>
            </div>
        </div>

        <!-- Tool 2: GC Content & Tm Calculator -->
        <div class="p-5 bg-emerald-50 rounded-xl border border-emerald-100">
            <h2 class="text-xl font-bold text-emerald-900 mb-4">🧬 2. DNA GC Content & Tm Calculator</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">DNA Sequence (A, T, G, C):</label>
                    <input type="text" id="dnaSeq" value="ATGCGATCG" class="w-full p-2.5 mt-1 border rounded-lg border-gray-300 uppercase focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button onclick="calcDNA()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg hover:bg-emerald-700 font-semibold transition">Analyze Sequence</button>
                <div id="dnaResult" class="mt-3 text-emerald-950 space-y-1 font-medium"></div>
            </div>
        </div>
    </div>

    <!-- Logic Script -->
    <script>
        function calcMolarity() {
            const m = parseFloat(document.getElementById('molarity').value) || 0;
            const v = parseFloat(document.getElementById('volume').value) || 0;
            const mw = parseFloat(document.getElementById('mw').value) || 0;
            const mass = m * v * mw;
            document.getElementById('molarityResult').innerText = `প্রয়োজনীয় কেমিক্যালের পরিমাণ: ${mass.toFixed(4)} grams`;
        }

        function calcDNA() {
            const seq = document.getElementById('dnaSeq').value.trim().toUpperCase();
            if (!seq || !/^[ATGC]+$/.test(seq)) {
                document.getElementById('dnaResult').innerHTML = '<span class="text-red-500 font-semibold">দয়া করে সঠিক DNA সিকোয়েন্স দিন (শুধু A, T, G, C)।</span>';
                return;
            }
            const len = seq.length;
            const g = (seq.match(/G/g) || []).length;
            const c = (seq.match(/C/g) || []).length;
            const a = (seq.match(/A/g) || []).length;
            const t = (seq.match(/T/g) || []).length;
            
            const gcPercent = ((g + c) / len) * 100;
            let tm = (a + t) * 2 + (g + c) * 4;
            if (len >= 14) {
                tm = 64.9 + 41 * (g + c - 16.4) / len;
            }

            document.getElementById('dnaResult').innerHTML = `
                <p>• <strong>Sequence Length:</strong> ${len} bp</p>
                <p>• <strong>GC Content:</strong> ${gcPercent.toFixed(2)}%</p>
                <p>• <strong>Estimated Tm:</strong> ${tm.toFixed(2)} °C</p>
            `;
        }
    </script>
</body>
</html>
